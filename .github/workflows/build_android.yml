name: Build Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: 'Build Far Cry Android APK & Engine (ARM64)'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK (r25c)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build zip unzip

      - name: Build Native Engine & Dependencies (ARM64)
        shell: bash
        run: |
          set -e
          set -o pipefail
          chmod +x buildscripts/build_android.sh
          ./buildscripts/build_android.sh --arch arm64 --release --ndk "${{ steps.setup-ndk.outputs.ndk-path }}" 2>&1 | tee build_native.log || {
            STATUS=$?
            ERR=$(grep "error:" build_native.log | tail -n 5 | tr '\n' ' ' | cut -c 1-2000)
            [ -z "$ERR" ] && ERR=$(tail -n 10 build_native.log | tr '\n' ' ' | cut -c 1-2000)
            echo "::error title=Compiler Error::$ERR"
            exit $STATUS
          }

      - name: Build APK with Gradle
        shell: bash
        run: |
          set -e
          set -o pipefail
          chmod +x android/gradlew
          ./android/gradlew -p android :app:assembleRelease --stacktrace 2>&1 | tee build_apk.log || {
            STATUS=$?
            echo "::error::Gradle build failed with exit code $STATUS"
            echo "### ❌ Gradle Build Errors" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build_apk.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build_apk.log
            exit $STATUS
          }

      - name: Inspect Built APK
        shell: bash
        run: |
          set -e
          echo "================ All APKs in Workspace ================"
          find . -name "*.apk" -ls
          
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file found in workspace!"
            exit 1
          fi

          echo "Selected APK: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "### 📦 Generated APK: \`$(basename $APK_PATH)\` ($(ls -lh $APK_PATH | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY

          echo "=== Packaged native libraries (.so) ==="
          unzip -l "$APK_PATH" | grep "lib/arm64-v8a"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NearChuckle-FarCry-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload Native .SO Libraries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NearChuckle-FarCry-Native-SO-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a/*.so
          retention-days: 30
