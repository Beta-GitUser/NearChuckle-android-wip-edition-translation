name: Build Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: 'Build Far Cry Android APK & Engine (ARM64)'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK (r25c)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build zip unzip

      - name: Build Native Engine & Dependencies (ARM64)
        run: |
          chmod +x buildscripts/build_android.sh
          ./buildscripts/build_android.sh --arch arm64 --release --ndk "${{ steps.setup-ndk.outputs.ndk-path }}" 2>&1 | tee build_native.log || {
            STATUS=$?
            echo "::error::Build failed with exit code $STATUS"
            echo "### ❌ Build Native Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 150 build_native.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build_native.log
            exit $STATUS
          }

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee ../build_apk.log || {
            STATUS=$?
            echo "::error::Gradle build failed with exit code $STATUS"
            echo "### ❌ Gradle Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 150 ../build_apk.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 ../build_apk.log
            exit $STATUS
          }

      - name: Inspect Built APK
        run: |
          echo "================ APK Output ================"
          find android/app/build -name "*.apk"
          echo "### 📦 Generated APKs" >> $GITHUB_STEP_SUMMARY
          for APK in $(find android/app/build -name "*.apk"); do
            echo "Found APK: $APK"
            ls -lh "$APK"
            echo "- **$(basename $APK)** ($(ls -lh $APK | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY
            echo "=== Packaged native libraries (.so) in $(basename $APK) ==="
            unzip -l "$APK" | grep "lib/arm64-v8a" || true
          done
          APK_COUNT=$(find android/app/build -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NearChuckle-FarCry-Android-APK
          path: android/app/build/**/*.apk
          retention-days: 30

      - name: Upload Native .SO Libraries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NearChuckle-FarCry-Native-SO-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a/*.so
          retention-days: 30
