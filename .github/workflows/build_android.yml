name: Build Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: 'Build Far Cry Android APK & Engine (ARM64)'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK (r25c)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build zip unzip

      - name: Build Native Engine & Dependencies (ARM64)
        shell: bash
        run: |
          chmod +x buildscripts/build_android.sh
          echo "Starting native build..."
          ./buildscripts/build_android.sh --arch arm64 --release --ndk "${{ steps.setup-ndk.outputs.ndk-path }}" > build_native.log 2>&1 || STATUS=$?
          STATUS=${STATUS:-0}
          echo "Native build finished with status $STATUS"
          if [ $STATUS -ne 0 ]; then
            echo "========== NATIVE BUILD FAILED (exit code $STATUS) =========="
            tail -n 120 build_native.log
            echo "============================================================="

            L1=$(tail -n 25 build_native.log | head -n 5 | tr '\r\n' ' | ' | sed 's/[^a-zA-Z0-9 ._:|/-]/_/g' | cut -c 1-250)
            L2=$(tail -n 20 build_native.log | head -n 5 | tr '\r\n' ' | ' | sed 's/[^a-zA-Z0-9 ._:|/-]/_/g' | cut -c 1-250)
            L3=$(tail -n 15 build_native.log | head -n 5 | tr '\r\n' ' | ' | sed 's/[^a-zA-Z0-9 ._:|/-]/_/g' | cut -c 1-250)
            L4=$(tail -n 10 build_native.log | head -n 5 | tr '\r\n' ' | ' | sed 's/[^a-zA-Z0-9 ._:|/-]/_/g' | cut -c 1-250)
            L5=$(tail -n 5 build_native.log | tr '\r\n' ' | ' | sed 's/[^a-zA-Z0-9 ._:|/-]/_/g' | cut -c 1-250)
            [ -n "$L1" ] && echo "::error file=README.md,line=1,title=Log Tail 1::$L1"
            [ -n "$L2" ] && echo "::error file=README.md,line=2,title=Log Tail 2::$L2"
            [ -n "$L3" ] && echo "::error file=README.md,line=3,title=Log Tail 3::$L3"
            [ -n "$L4" ] && echo "::error file=README.md,line=4,title=Log Tail 4::$L4"
            [ -n "$L5" ] && echo "::error file=README.md,line=5,title=Log Tail 5::$L5"

            FAIL_LINES=$(grep -E -i "fatal|error|fail|undefined|\*\*\*" build_native.log | tail -n 5 | tr '\r\n' ' | ' | sed 's/[^a-zA-Z0-9 ._:|/-]/_/g' | cut -c 1-250)
            [ -n "$FAIL_LINES" ] && echo "::error file=README.md,line=6,title=Fail Lines::$FAIL_LINES"

            echo "### ❌ Native Build Failed (exit code $STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build_native.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $STATUS
          fi
          echo "### ✅ Native Build Succeeded" >> $GITHUB_STEP_SUMMARY

      - name: Build APK with Gradle
        shell: bash
        run: |
          chmod +x android/gradlew
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" >> android/local.properties
          echo "Local properties:"
          cat android/local.properties
          echo "Building APK with Gradle..."
          ./android/gradlew -p android :app:assembleRelease --stacktrace > build_apk.log 2>&1 || STATUS=$?
          STATUS=${STATUS:-0}
          echo "Gradle finished with status $STATUS"
          if [ $STATUS -ne 0 ]; then
            echo "========== GRADLE BUILD FAILED (exit code $STATUS) =========="
            tail -n 120 build_apk.log
            echo "============================================================="

            G1=$(grep -E "What went wrong:|Execution failed for task" build_apk.log -A 4 | head -n 8 | tr '\r\n' ' | ' | sed 's/[^a-zA-Z0-9 ._:|/-]/_/g' | cut -c 1-250)
            G2=$(grep -E -i "error:|failed|failure" build_apk.log | grep -v "^\s*at " | tail -n 5 | tr '\r\n' ' | ' | sed 's/[^a-zA-Z0-9 ._:|/-]/_/g' | cut -c 1-250)
            G3=$(tail -n 30 build_apk.log | grep -v "^\s*at " | head -n 8 | tr '\r\n' ' | ' | sed 's/[^a-zA-Z0-9 ._:|/-]/_/g' | cut -c 1-250)
            G4=$(tail -n 15 build_apk.log | grep -v "^\s*at " | tail -n 8 | tr '\r\n' ' | ' | sed 's/[^a-zA-Z0-9 ._:|/-]/_/g' | cut -c 1-250)

            [ -n "$G1" ] && echo "::error file=README.md,line=10,title=Gradle What Went Wrong::$G1"
            [ -n "$G2" ] && echo "::error file=README.md,line=11,title=Gradle Errors::$G2"
            [ -n "$G3" ] && echo "::error file=README.md,line=12,title=Gradle Tail 1::$G3"
            [ -n "$G4" ] && echo "::error file=README.md,line=13,title=Gradle Tail 2::$G4"
            echo "::error file=README.md,line=14,title=Gradle Failed Exit $STATUS::See summary"

            echo "### ❌ Gradle Build Failed (exit code $STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build_apk.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $STATUS
          fi
          echo "### ✅ Gradle Build Succeeded" >> $GITHUB_STEP_SUMMARY

      - name: Inspect Built APK
        shell: bash
        run: |
          set -e
          echo "================ All APKs in Workspace ================"
          find . -name "*.apk" -ls
          
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file found in workspace!"
            exit 1
          fi

          echo "Selected APK: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "### 📦 Generated APK: \`$(basename $APK_PATH)\` ($(ls -lh $APK_PATH | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY

          echo "=== Packaged native libraries (.so) ==="
          unzip -l "$APK_PATH" | grep "lib/arm64-v8a"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NearChuckle-FarCry-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload Native .SO Libraries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NearChuckle-FarCry-Native-SO-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a/*.so
          retention-days: 30

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_native.log
            build_apk.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Push Build Log to Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-log-arm64 2>/dev/null || git checkout -B build-log-arm64
          git rm -rf . >/dev/null 2>&1 || true
          [ -f build_native.log ] && tail -n 500 build_native.log > build_native_tail.txt
          [ -f build_apk.log ] && tail -n 500 build_apk.log > build_apk_tail.txt
          git add build_native_tail.txt build_apk_tail.txt 2>/dev/null || true
          git commit -m "Build logs" || true
          git push -f origin build-log-arm64 || true
