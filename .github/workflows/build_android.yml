name: Build Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: 'Build Far Cry Android APK & Engine (ARM64)'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK (r25c)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build zip unzip

      - name: Build Native Engine & Dependencies (ARM64)
        run: |
          chmod +x buildscripts/build_android.sh
          ./buildscripts/build_android.sh --arch arm64 --release --ndk "${{ steps.setup-ndk.outputs.ndk-path }}"

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Inspect Built APK
        run: |
          echo "================ APK Output ================"
          ls -lh android/app/build/outputs/apk/release/
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Selected APK: $APK_PATH"
            echo "=== Packaged native libraries (.so) ==="
            unzip -l "$APK_PATH" | grep "lib/arm64-v8a" || true
          else
            echo "ERROR: No APK found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NearChuckle-FarCry-Android-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Native .SO Libraries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NearChuckle-FarCry-Native-SO-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a/*.so
          retention-days: 30
